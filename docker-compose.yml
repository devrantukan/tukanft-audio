services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8088
    expose:
      - "3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - sessions_data:/app/.sessions
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/samples"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sessions_data:
